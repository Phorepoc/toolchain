name: images

# Builds the toolchain images in dependency order (base -> arm -> mesa, base -> web) and publishes them to
# ghcr.io/phorepoc/<image>:
#   push to main   -> :latest + :sha-<short>
#   tag vX.Y.Z     -> :X.Y.Z + :latest + :sha-<short>
#   pull request   -> build + smoke test only, nothing published
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/phorepoc

jobs:
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the mesa layer stack needs several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build
        run: |
          set -eu
          docker build -f images/base/Dockerfile -t phorepoc/base:ci .
          docker build -f images/arm/Dockerfile  --build-arg BASE=phorepoc/base:ci -t phorepoc/arm:ci  images/arm
          docker build -f images/web/Dockerfile  --build-arg BASE=phorepoc/base:ci -t phorepoc/web:ci  images/web
          docker build -f images/mesa/Dockerfile --build-arg BASE=phorepoc/arm:ci  -t phorepoc/mesa:ci images/mesa

      - name: Smoke test
        run: sh tests/smoke.sh phorepoc/base:ci

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          short=${GITHUB_SHA::7}
          tags="latest sha-$short"
          case "$GITHUB_REF" in refs/tags/v*) tags="$tags ${GITHUB_REF#refs/tags/v}" ;; esac
          for img in base arm web mesa; do
            for t in $tags; do
              docker tag "phorepoc/$img:ci" "$REGISTRY/$img:$t"
              docker push "$REGISTRY/$img:$t"
            done
          done
